name: Matchstick Tests

# pull_request as well as push: a push runs in the repository pushed to, so without it a pull
# request from a fork shows no checks here
on: [push, pull_request]

jobs:
  tests:
    # `graph test` (graph-cli 0.56) downloads the Matchstick binary named for the runner's Ubuntu
    # version, and Matchstick 0.6.0 is published for Ubuntu 22 only.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # graph-cli's dependencies no longer install on Node 16
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # The lockfile this package commits is bun.lock. Installing with yarn finds no lockfile and
      # resolves every dependency afresh on each run.
      - name: Install Dependencies
        run: |
          npm install -g bun@1.3.14
          bun install --frozen-lockfile

      - name: Build Subgraph
        run: |
          bun run codegen
          bun run build

      # Without a version `graph test` asks GitHub for Matchstick's latest release on every run.
      - name: Run Tests
        run: bun run test -v 0.6.0

    timeout-minutes: 10

  v3:
    # `graph test` (graph-cli 0.56) downloads the Matchstick binary named for the runner's Ubuntu
    # version, and Matchstick 0.6.0 is published for Ubuntu 22 only.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v4

      # graph-cli's dependencies no longer install on Node 16
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: |
          npm install -g yarn
          yarn --frozen-lockfile

      - name: Check ABIs against their recorded commit
        run: yarn abis:check

      - name: Build Subgraph for each network
        run: |
          for config in config/*.json; do
            yarn configure "$config"
            yarn codegen
            yarn build
          done

      # a manifest with several factories must keep building, and the tests cover every deployment
      - name: Build and Test with two factories
        run: |
          yarn configure tests/fixtures/two-factories.json
          yarn codegen
          yarn build
          yarn test

    timeout-minutes: 10
