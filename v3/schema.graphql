# Ajna v3 subgraph schema.
#
# Entities are added together with the handlers that write them. Surplus auctions and the
# PositionManager are not covered yet.
#
# Amounts, prices and rates are BigDecimal in whole units (the contracts' WAD values divided by
# 1e18). Bucket indexes are Int. Counts, block numbers and timestamps are BigInt.
#
# Pool, Bucket, Lend and Loan hold contract state as it was at the end of the block of the last
# event that refreshed them, recorded in updatedAtBlockNumber. Interest accrues between events, so
# a value can be older than the block being queried. Debts are stored in t0 terms, which do not
# change as interest accrues: multiply by the pool's current inflator for the debt owed.

type Token @entity {
  id: Bytes!                # token address
  symbol: String!
  name: String!
  decimals: Int!
  poolCount: BigInt!        # pools using this token as collateral or as quote
  poolsAsCollateral: [Pool!]! @derivedFrom(field: "collateralToken")
  poolsAsQuote: [Pool!]! @derivedFrom(field: "quoteToken")
  txCount: BigInt!          # actions across all pools that use this token
}


  # # # # # # # # #
  # POOL ENTITIES #
  # # # # # # # # #

# Ajna v3 has one factory per loan term. A token pair has at most one pool per factory.
type PoolFactory @entity {
  id: Bytes!                # factory address
  loanTerm: BigInt!         # term of every loan in this factory's pools, in seconds
  poolCount: BigInt!        # number of pools deployed by the factory
  pools: [Pool!]! @derivedFrom(field: "factory")
}

type Pool @entity {
  id: Bytes!                         # pool address
  factory: PoolFactory!              # factory that deployed the pool
  loanTerm: BigInt!                  # term of every loan in the pool, in seconds
  createdAtBlockNumber: BigInt!
  createdAtTimestamp: BigInt!
  collateralToken: Token!
  quoteToken: Token!
  # actions performed on the pool; a call that emits several events is counted once
  txCount: BigInt!

  # DEPOSITS AND DEBT
  poolSize: BigDecimal!              # quote deposited in buckets, excluding quote escrowed for marked lenders
  debt: BigDecimal!                  # debt owed by borrowers, at the pending inflator
  t0debt: BigDecimal!                # debt in t0 terms: multiply by the inflator for the debt owed
  inflator: BigDecimal!              # pending inflator
  loansCount: BigInt!                # number of loans that have debt

  # RATES
  borrowRate: BigDecimal!            # annual interest rate paid by borrowers
  rateAtTarget: BigDecimal!          # borrow rate the adaptive curve gives at target utilization
  utilization: BigDecimal!           # debt over deposits, at most 1
  # annual rate lenders earn on average: borrowRate * utilization * 0.96. A bucket's own rate
  # depends on how much of that bucket's deposit is lent.
  lendRate: BigDecimal!

  # TOKEN BALANCES
  quoteTokenBalance: BigDecimal!     # quote token held by the pool contract
  collateralBalance: BigDecimal!     # collateral token held by the pool contract
  escrowedQuote: BigDecimal!         # quote escrowed for marked lenders, not yet claimed
  availableQuote: BigDecimal!        # quote balance not owed to marked lenders or the surplus auction

  # COLLATERAL OWED
  # The pool changes these two by exactly the amounts in its events, so they are added up from
  # the events rather than read.
  pledgedCollateral: BigDecimal!     # collateral held on loans, owed to borrowers
  lenderCollateral: BigDecimal!      # collateral held in buckets and exit escrow, owed to lenders

  # SURPLUS
  quoteSurplus: BigDecimal!                  # excess quote not yet in an auction lot
  quoteSurplusClaimable: BigDecimal!         # quote a surplus auction kick would add to the lot now
  quoteSurplusLotRemaining: BigDecimal!      # quote left in the current or last auction lot
  collateralSurplus: BigDecimal!             # free collateral not yet in an auction lot
  collateralSurplusClaimable: BigDecimal!    # collateral a surplus auction kick would add to the lot now
  collateralSurplusLotRemaining: BigDecimal! # collateral left in the current or last auction lot

  # FLASHLOANS
  quoteTokenFlashloaned: BigDecimal!         # total quote token lent in flashloans
  collateralFlashloaned: BigDecimal!         # total collateral token lent in flashloans

  # number of InterestUpdateFailure events: times interest accrual or a rate update failed and
  # the pool carried on at its stored values
  interestUpdateFailures: BigInt!

  buckets: [Bucket!]! @derivedFrom(field: "pool")
  loans: [Loan!]! @derivedFrom(field: "pool")

  # block at which the fields read from the contracts were read: deposits and debt other than
  # loansCount, rates, token balances and surplus
  updatedAtBlockNumber: BigInt!
  updatedAtTimestamp: BigInt!
}

type Bucket @entity {
  id: Bytes!                 # $poolAddress + '#' + $bucketIndex
  pool: Pool!
  poolAddress: String!
  bucketIndex: Int!
  bucketPrice: BigDecimal!
  deposit: BigDecimal!       # quote in the bucket including interest, excluding quote escrowed for marked lenders
  collateral: BigDecimal!    # collateral in the bucket available to its LP holders
  lpb: BigDecimal!           # LP outstanding in the bucket; LP the exit queue has funded has left it
  exchangeRate: BigDecimal!  # quote value of one LP
  # Debt drawn from the bucket, in t0 terms. Each loan borrows from one bucket, and a bucket's
  # lenders earn interest only on the debt drawn from it.
  t0debt: BigDecimal!
  lends: [Lend!]! @derivedFrom(field: "bucket")
  loans: [Loan!]! @derivedFrom(field: "bucket")

  # EXIT QUEUE
  # A lender who marks their LP for withdrawal takes a place on the bucket's exit queue. Quote and
  # collateral that reach the bucket fund the places in the order they were marked: the funded LP
  # leaves the bucket, and what paid for it waits in escrow for the lender to claim. Positions on
  # the queue are measured in LP. These four fields follow the pool's events, which give them exactly.
  queueHead: BigDecimal!         # LP the queue has funded or given up so far
  queueTail: BigDecimal!         # LP marked so far; queueTail - queueHead is marked LP still waiting in the bucket
  escrowQuote: BigDecimal!       # quote escrowed for funded places, not yet claimed
  escrowCollateral: BigDecimal!  # collateral escrowed for funded places, not yet claimed
  exitQueuePlaces: [ExitQueuePlace!]! @derivedFrom(field: "bucket")

  # block at which the fields above the exit queue were read
  updatedAtBlockNumber: BigInt!
  updatedAtTimestamp: BigInt!
}

# A lender's LP in one bucket. Removed when the lender has no LP left there.
type Lend @entity {
  id: Bytes!                    # $bucketId + '|' + $lender
  pool: Pool!
  poolAddress: String!
  bucket: Bucket!
  bucketIndex: Int!
  lender: Bytes!                # address of the lender
  account: Account!             # the same lender, as an Account
  lpb: BigDecimal!              # all LP the lender holds in the bucket
  # quote value of that LP: LP still in the bucket at the bucket's exchange rate, plus LP the
  # exit queue has funded at the worth it was funded at
  lpbValueInQuote: BigDecimal!
  depositTime: BigInt!          # timestamp the pool records for the lender's last deposit

  # EXIT QUEUE
  # As read when the Lend was last refreshed. The queue can fund a marked lender's LP without an
  # event that names them, so liveLpb and fundedValueInQuote can be out of date: the lender's
  # ExitQueuePlace and the bucket's queueHead always tell how much of their LP is funded.
  marked: Boolean!              # whether the lender has marked their LP in this bucket for withdrawal
  liveLpb: BigDecimal!          # LP still in the bucket and earning: all of lpb unless some of it is funded
  fundedValueInQuote: BigDecimal! # worth of the funded LP, fixed when it was funded and claimable from escrow

  updatedAtBlockNumber: BigInt!
  updatedAtTimestamp: BigInt!
}

# A marked lender's place on a bucket's exit queue. It exists from the lender's
# MarkQuoteForWithdrawal until their claims have redeemed all of its LP, and has the same id as
# the lender's Lend. It follows the pool's events, so unlike a Lend it is exact after every event.
#
# The place covers the queue from queueStart to queueStart + lpb. The part of it below the
# bucket's queueHead has been funded (or given up), and can be claimed with removeQuoteToken or
# removeCollateral.
type ExitQueuePlace @entity {
  id: Bytes!                    # $bucketId + '|' + $lender
  pool: Pool!
  bucket: Bucket!
  bucketIndex: Int!
  lender: Bytes!                # address of the lender
  account: Account!             # the same lender, as an Account
  queueStart: BigDecimal!       # where the place starts on the queue, in LP; each claim moves it forward
  lpb: BigDecimal!              # LP left in the place: what was marked, less what claims have redeemed
  markedAtBlockNumber: BigInt!
  markedAtTimestamp: BigInt!
}

enum LoanStatus {
  Active    # has debt
  DebtFree  # has no debt and still holds collateral, which its borrower can pull or borrow against
  Closed    # has neither debt nor collateral; the pool no longer accepts its id
}

# A borrower can hold any number of loans in a pool. Each is drawn from a single bucket and has
# its own collateral, debt and expiry. A loan never takes on more debt and never changes bucket:
# moving or improving a loan opens a new one. Loans are kept after they close.
#
# A loan with debt can be called by anyone once the block timestamp is past its expiry, or while
# its collateral at the bucket price is worth less than 1.05 times its debt.
type Loan @entity {
  id: Bytes!                    # $poolAddress + '|' + $loanId
  pool: Pool!
  poolAddress: String!
  loanId: Bytes!                # the pool's id for the loan: the borrower's address followed by counter
  counter: BigInt!              # the pool numbers its loans from 1, in the order they are opened
  borrower: Bytes!              # address of the borrower
  account: Account!             # the same borrower, as an Account
  bucket: Bucket!               # bucket the loan is drawn from
  bucketIndex: Int!
  status: LoanStatus!
  collateralPledged: BigDecimal!
  t0debt: BigDecimal!           # debt in t0 terms: multiply by the pool's inflator for the debt owed
  t0Tp: BigDecimal!             # threshold price in t0 terms: 1.05 * t0debt / collateralPledged
  # t0Tp at the pool's inflator when the loan was last refreshed. It rounds differently from the
  # pool's own check, so do not decide whether a loan can be called by comparing it with the
  # bucket price.
  thresholdPrice: BigDecimal!
  inflatorAtDraw: BigDecimal!   # pool inflator when the loan was opened
  expiry: BigInt!               # timestamp after which the loan can be called whatever its collateral
  movedFrom: Loan               # loan whose debt was moved to open this one, if it was opened by a move
  movedTo: [Loan!]! @derivedFrom(field: "movedFrom")
  call: LoanCalled              # set if the loan was called
  createdAtBlockNumber: BigInt!
  createdAtTimestamp: BigInt!
  closedAtBlockNumber: BigInt   # set once the status is Closed
  closedAtTimestamp: BigInt
  updatedAtBlockNumber: BigInt!
  updatedAtTimestamp: BigInt!
}

type Account @entity {
  id: Bytes!                # account address
  lends: [Lend!]! @derivedFrom(field: "account")
  loans: [Loan!]! @derivedFrom(field: "account")
  exitQueuePlaces: [ExitQueuePlace!]! @derivedFrom(field: "account")
  # the account's lender actions, and actions on its loans whoever performed them
  txCount: BigInt!
}

# An address a borrower has approved to borrow, pull collateral and move loans on their behalf
# in a pool. Removed when the approval is revoked.
type BorrowerDelegate @entity {
  id: Bytes!                # $poolAddress + '|' + $borrower + '|' + $delegate
  pool: Pool!
  borrower: Bytes!
  delegate: Bytes!
}

# LP transferors a lender has approved in a pool. Removed when none are left.
type LPTransferorList @entity {
  id: Bytes!                # $poolAddress + '|' + $lender
  pool: Pool!
  lender: Bytes!
  transferors: [Bytes!]!    # addresses allowed to transfer LP to the lender
}

# The LP allowances a lender has granted one spender in a pool.
type LPAllowanceList @entity {
  id: Bytes!                # $poolAddress + '|' + $lender + '|' + $spender
  pool: Pool!
  lender: Bytes!            # owner of the LP
  spender: Bytes!           # address the LP may be transferred to
  allowances: [LPAllowance!]! @derivedFrom(field: "allowanceList")
}

# An LP allowance in a single bucket. Removed when it is used, revoked or reduced to zero.
type LPAllowance @entity {
  id: Bytes!                # $allowanceListId + '|' + $bucketIndex
  allowanceList: LPAllowanceList!
  index: Int!               # bucket index
  amount: BigDecimal!       # LP the spender may receive from this bucket
}


  # # # # # # # # # # # # #
  # POOL FACTORY EVENTS   #
  # # # # # # # # # # # # #

type PoolCreated @entity(immutable: true) {
  id: Bytes!                # transaction hash + log index
  pool: Pool!
  factory: PoolFactory!
  collateralToken: Bytes!   # address of the pool's collateral token
  quoteToken: Bytes!        # address of the pool's quote token
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}


  # # # # # # # #
  # POOL EVENTS #
  # # # # # # # #

type AddCollateral @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  actor: Bytes!             # address that added the collateral
  index: Int!
  amount: BigDecimal!
  lpAwarded: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AddQuoteToken @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  lender: Bytes!
  index: Int!
  amount: BigDecimal!
  lpAwarded: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MoveQuoteToken @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  lender: Bytes!
  from: Bucket!
  to: Bucket!
  amount: BigDecimal!
  lpRedeemedFrom: BigDecimal!
  lpAwardedTo: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RemoveCollateral @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  claimer: Bytes!           # address that removed the collateral
  index: Int!
  amount: BigDecimal!       # can be zero for an exit claim that only clears LP too small to pay out
  lpRedeemed: BigDecimal!
  # true if the claimer was marked: the collateral came from the bucket's exit escrow, and the LP
  # redeemed had already left the bucket
  isExitClaim: Boolean!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RemoveQuoteToken @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  lender: Bytes!
  index: Int!
  amount: BigDecimal!       # can be zero for an exit claim that only clears LP too small to pay out
  lpRedeemed: BigDecimal!
  # true if the lender was marked: the quote came from the bucket's exit escrow, and the LP
  # redeemed had already left the bucket
  isExitClaim: Boolean!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# A lender marked all of their LP in a bucket for withdrawal, taking a place on its exit queue.
type MarkQuoteForWithdrawal @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  lender: Bytes!
  index: Int!
  lp: BigDecimal!           # LP placed on the queue
  queueStart: BigDecimal!   # where the place starts on the queue, in LP
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LP at the front of a bucket's exit queue left the bucket. Emitted inside the call that brought
# quote or collateral to the bucket, before that call's own event.
type ExitQueueFunded @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  bucket: Bucket!
  index: Int!
  lp: BigDecimal!           # LP that left the queue and the bucket
  quote: BigDecimal!        # quote moved from the bucket's deposit to its exit escrow
  collateral: BigDecimal!   # collateral moved from the bucket to its exit escrow
  queueHead: BigDecimal!    # the queue's head after this event, in LP
  # true if nothing was escrowed: the LP was worth less than one quote token unit and was given
  # up for no payment
  isGiveUp: Boolean!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type TransferLP @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  owner: Bytes!             # lender the LP was transferred from
  newOwner: Bytes!          # lender the LP was transferred to
  indexes: [Int!]!          # every bucket index named in the call, with or without LP to transfer
  lp: BigDecimal!           # total LP transferred across those buckets
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Debt was drawn into a new loan, or collateral was pledged to an existing one.
type DrawDebt @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  loan: Loan!
  bucket: Bucket!
  borrower: Bytes!
  amountBorrowed: BigDecimal!     # zero when collateral was pledged to an existing loan
  collateralPledged: BigDecimal!  # collateral transferred in; a new loan can also take over a closed loan's
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RepayDebt @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  loan: Loan!
  bucket: Bucket!
  borrower: Bytes!
  quoteRepaid: BigDecimal!
  collateralPulled: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Debt, with collateral, moved out of a loan into a new loan in another bucket, or collateral
# alone moved into another of the borrower's loans. Emitted by moveLoan and by improveLoan.
type MoveLoan @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  borrower: Bytes!
  fromLoan: Loan!
  toLoan: Loan!
  fromBucket: Bucket!
  toBucket: Bucket!
  debtMoved: BigDecimal!
  collateralMoved: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Anyone moved a whole loan into a bucket with a higher price. Follows the MoveLoan of the same call.
type ImproveLoan @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  caller: Bytes!
  fromLoan: Loan!
  toLoan: Loan!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# An action cleared a loan's debt or deleted the loan.
type LoanClosed @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  loan: Loan!
  borrower: Bytes!
  deleted: Boolean!               # false if the debt was cleared and the loan still held collateral
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# An expired or under-collateralized loan was settled in collateral.
type LoanCalled @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  loan: Loan!
  bucket: Bucket!
  borrower: Bytes!
  caller: Bytes!
  debt: BigDecimal!               # debt of the loan when it was called
  lenderCollateral: BigDecimal!   # collateral given to the loan's bucket
  callerCollateral: BigDecimal!   # collateral paid to the caller
  surplusCollateral: BigDecimal!  # collateral left in the pool as surplus
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SetBorrowerDelegates @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  borrower: Bytes!
  delegates: [Bytes!]!
  approved: Boolean!              # true if the delegates were approved, false if they were revoked
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Flashloan @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  token: Token!             # the pool's quote or collateral token
  borrower: Bytes!          # contract that received the loan
  amount: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# The pool stored a new borrow rate after an action changed its utilization.
type UpdateInterestRate @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  oldBorrowRate: BigDecimal!
  newBorrowRate: BigDecimal!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Interest accrual or a rate update reverted inside the pool, which carried on at its stored values.
type InterestUpdateFailure @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
